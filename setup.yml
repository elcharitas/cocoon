#cloud-config
package_update: true
packages:
  - curl
  - git
  - jq
  - zsh
  - golang-go
  - unzip
  - gnupg
  - build-essential
  - network-manager
  - avahi-daemon
  - nftables
  - openssl
  - ca-certificates
  - ripgrep
  - fd-find
  - rsync
  - yq
  - gettext-base
  - locales

write_files:
  - path: /etc/systemd/system/umbreld.service
    content: |
      [Unit]
      Description=Patched Umbrel Daemon
      After=docker.service network-online.target
      Requires=docker.service
      Wants=network-online.target

      [Service]
      WorkingDirectory=/opt/umbrel/packages/umbreld
      ExecStart=/usr/bin/npm start -- --data-directory /opt/umbrel/data
      Restart=always
      Environment="NODE_ENV=production"

      [Install]
      WantedBy=multi-user.target

  - path: /usr/local/bin/update-os
    permissions: '0755'
    content: |
      #!/bin/bash
      set -e
      echo "Stopping daemon..."
      systemctl stop umbreld.service || true

      echo "Pulling Umbrel source..."
      git config --global --add safe.directory /opt/umbrel
      cd /opt/umbrel
      git reset --hard HEAD
      git pull

      echo "Pulling patches..."
      cd /tmp/dockur-umbrel
      git pull

      echo "Applying patches..."
      cd /opt/umbrel
      sed -i 's/umbrelOS/Debian/g' packages/umbreld/source/modules/system/system.ts || true
      if [ -d "/tmp/dockur-umbrel/src" ]; then cp -r /tmp/dockur-umbrel/src/* /opt/umbrel/; fi

      echo "Disabling reboot..."
      mv /usr/sbin/reboot /usr/sbin/reboot.bak 2>/dev/null || true
      printf '#!/bin/sh\necho "Reboot disabled"\n' > /usr/sbin/reboot
      chmod +x /usr/sbin/reboot

      echo "Installing dependencies..."
      cd packages/umbreld
      npm ci

      echo "Rebuilding UI..."
      cd /opt/umbrel/packages/ui
      npm ci
      npm install @tsconfig/node22
      npm run build
      mkdir -p /opt/umbrel/packages/umbreld/ui
      cp -r dist/* /opt/umbrel/packages/umbreld/ui/
      cd /opt/umbrel/packages/umbreld

      echo "Starting daemon..."
      systemctl start umbreld.service
      echo "OS Update complete."

runcmd:
  # Install Docker from official repo (docker.io lacks compose plugin)
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin

  # Install Node.js
  - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
  - apt-get install -y nodejs

  # Install gh cli
  - curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | gpg --dearmor -o /usr/share/keyrings/githubcli-archive-keyring.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
  - apt-get update
  - apt-get install -y gh

  # Install Openai Codex CLI & Bun
  - curl -fsSL https://bun.sh/install | bash
  - /root/.bun/bin/bun install -g @openai/codex-cli

  # Install Oh My Zsh (non-interactive) with git and docker plugins
  - sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
  - sed -i 's/plugins=(git)/plugins=(git docker)/' /root/.zshrc

  # Set zsh as default shell
  - chsh -s $(which zsh)

  # Fix locale
  - sed -i 's/# en_US.UTF-8/en_US.UTF-8/' /etc/locale.gen
  - locale-gen en_US.UTF-8
  - update-locale LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8

  # Add Go bin to PATH
  - echo 'export PATH=$PATH:$(go env GOPATH)/bin' >> /root/.zshrc

  # Docker auto-prune (weekly)
  - |
    cat << 'EOF' > /etc/systemd/system/docker-prune.service
    [Unit]
    Description=Docker system prune

    [Service]
    Type=oneshot
    ExecStart=/usr/bin/docker system prune -af
    EOF
  - |
    cat << 'EOF' > /etc/systemd/system/docker-prune.timer
    [Unit]
    Description=Weekly Docker system prune

    [Timer]
    OnCalendar=weekly
    Persistent=true

    [Install]
    WantedBy=timers.target
    EOF
  - systemctl daemon-reload && systemctl enable docker-prune.timer

  # Generate GPG key
  - |
    cat << 'EOF' > /tmp/gpg-batch
    %no-protection
    Key-Type: RSA
    Key-Length: 4096
    Subkey-Type: RSA
    Subkey-Length: 4096
    Name-Real: elcharitas
    Name-Email: jonathanirhodia@gmail.com
    Expire-Date: 0
    %commit
    EOF
  - gpg --batch --gen-key /tmp/gpg-batch
  - rm /tmp/gpg-batch

  # Generate SSH key
  - ssh-keygen -t ed25519 -C "jonathanirhodia@gmail.com" -f /root/.ssh/id_ed25519 -N ""

  # Configure git
  - git config --global user.name "elcharitas"
  - git config --global user.email "jonathanirhodia@gmail.com"
  - git config --global gpg.program gpg
  - git config --global push.autoSetupRemote true
  - git config --global rerere.enabled true

  # Print keys for GitHub setup
  - echo "=== Add this SSH public key to GitHub ==="
  - cat /root/.ssh/id_ed25519.pub
  - echo "=== Add this GPG public key to GitHub ==="
  - gpg --armor --export jonathanirhodia@gmail.com

  # Clone Umbrel repositories for the first time
  - git clone https://github.com/getumbrel/umbrel.git /opt/umbrel
  - git clone https://github.com/dockur/umbrel.git /tmp/dockur-umbrel

  # Create data directory
  - mkdir -p /opt/umbrel/data

  # Build UI
  - cd /opt/umbrel/packages/ui && npm ci && npm install @tsconfig/node22 && npm run build && mkdir -p /opt/umbrel/packages/umbreld/ui && cp -r dist/* /opt/umbrel/packages/umbreld/ui/

  # Stage the systemd service
  - systemctl daemon-reload

  # Execute the global script for the initial build
  - /usr/local/bin/update-os

  # Ensure it starts on boot
  - systemctl enable umbreld.service
